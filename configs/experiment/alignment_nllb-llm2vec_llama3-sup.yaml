# @package _global_

defaults:
  # - default
  - default_llm2vec
  - /dataspec@datamodule.train.train: fineweb_alignment_iter
  - override /module: nllb-llm2vec

run:
  task: nllb-llm2vec-adaptation
  pretrained_model_name_or_path: ${hydra:runtime.cwd}/data/model/llm2vec_llama3_supervised/
  base_model: "McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp"
  seed: ${rnd:1,1000000}
  train_batch_size: 4
  val_test_batch_size: 4
  max_length: 512
  ckpt_interval: 0.1
  ckpt_path:
    _target_: src.mt_llm.utils.get_highest_step_file
    directory: ${hydra:runtime.output_dir}/checkpoints/

trainer:
  deterministic: false
  precision: "bf16-mixed"
  max_steps: 10000
  devices: 2
  accumulate_grad_batches: 4
  num_sanity_val_steps: 0
  limit_val_batches: 0
  limit_test_batches: 0
  use_distributed_sampler: false
  # default_root_dir: ${hydra:runtime.output_dir}
  # plugins:
  #   _target_: lightning.pytorch.plugins.environments.SLURMEnvironment

module:
  _target_: src.mt_llm.module.SpanDistillationModule
  optimizer:
    lr: 5e-4
  scheduler:
    num_warmup_steps: 0.01
  nllb_ckpt: null
  model:
    up_proj_state_dict: ${hydra:runtime.cwd}/data/model/up-proj_llm2vec_llama3.pth


logger:
  wandb:
    name: "model=llama3-supervised_max-steps=${trainer.max_steps}_bs=${_log_vars.train_batch_size}_grad_accum=${trainer.accumulate_grad_batches}_lr=${module.optimizer.lr}_scheduler=${module.scheduler.num_warmup_steps}_seed=${run.seed}"
    tags:
      - "bs=${_log_vars.train_batch_size}"
      - "grad_accum=${trainer.accumulate_grad_batches}"
      - "lr=${module.optimizer.lr}"
      - "scheduler=${module.scheduler.num_warmup_steps}"
    entity: wuenlp
    project: ${run.task}

callbacks:
  learning_rate:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
  model_checkpoint_on_epoch:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: null # name of the logged metric which determines when model is improving
    every_n_epochs: null
    every_n_train_steps:
      _target_: builtins.int
      _args_:
        - _target_: builtins.float.__mul__
          _args_:
            - ${run.ckpt_interval}
            - ${trainer.max_steps}
    verbose: false
    save_top_k: -1 # -1 -> all models are saved
    filename: "step={step}"
    save_last: false # additionaly always save model from last epoch
    dirpath: "${hydra:runtime.output_dir}/checkpoints/"
    save_weights_only: false
    auto_insert_metric_name: false
