# @package _global_

defaults:
  - /dataspecs@datamodule.train: nusax_train_llm2vec
  - /dataspecs@datamodule.val:
      # - nusax_val_test_en
      - nusax_val_test
  - /dataspecs/module@datamodule.val:
      # - nusax_val_test_en_nllb-llm2vec
      - nusax_val_test_nllb-llm2vec
  - default_llm2vec
  - override /module: hf_nllb-llm2vec

run:
  task: nusax_llm2vec_train
  seed: 42
  train_batch_size: 4
  val_test_batch_size: 16
  max_length: 256

trainer:
  num_sanity_val_steps: 0
  max_epochs: 20
  accumulate_grad_batches: 8
  check_val_every_n_epoch: 2
  enable_checkpointing: false

logger:
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${hydra:runtime.output_dir}
  wandb:
    name: "model=nllb-llm2vec-llama3.1-unsupervised_epochs=${trainer.max_epochs}_batch-size=${_log_vars.train_batch_size}_accumulate-grad-batches=${trainer.accumulate_grad_batches}_lr=${module.optimizer.lr}_scheduler=${module.scheduler.num_warmup_steps}_seed=${run.seed}"
    tags:
      - "bs=${_log_vars.train_batch_size}"
      - "lr=${module.optimizer.lr}"
      - "scheduler=${module.scheduler.num_warmup_steps}"
      - "accumulate-grad-batches=${trainer.accumulate_grad_batches}"
    entity: wuenlp
    project: ${run.task}

callbacks:
  learning_rate:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
